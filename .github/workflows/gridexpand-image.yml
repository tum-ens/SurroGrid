# Build the GridExpand image (CLI + web service, GridExpand/docker/Dockerfile) and publish it to
# GHCR as ghcr.io/<owner>/gridexpand. GridPlanner pulls it (see its .env.example).
#   push to main / develop / feature/**  -> tag = branch name with / -> - (feature/x -> feature-x);
#                                           main also gets `latest`
#   push of a version tag vX.Y.Z          -> X.Y.Z and X.Y
#   every build                           -> sha-<short commit>
#   workflow_dispatch                     -> the tags of the chosen ref
# After the first push: make the package public (GitHub: Packages -> gridexpand -> Package settings)
# so that `docker pull` works without a login, or give readers `docker login ghcr.io`.
name: GridExpand image

on:
  push:
    branches: ["main", "develop", "feature/**"]
    tags: ["v*.*.*"]
    paths:
      - "GridExpand/**"
      - ".github/workflows/gridexpand-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gridexpand-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (the image has ~4 GB of scientific packages)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Image name (lower case owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gridexpand" >> "$GITHUB_ENV"

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=gridexpand
            org.opencontainers.image.description=GridExpand CLI and web service (load allocation, urbs, power flow, grid expansion; pylovo-ui plugin)

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: GridExpand
          file: GridExpand/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=gridexpand
          cache-to: type=gha,scope=gridexpand,mode=max
