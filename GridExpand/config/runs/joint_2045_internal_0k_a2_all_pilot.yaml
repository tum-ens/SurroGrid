# PILOT, HEMS 0 K control of joint_2045_internal_2k_a2_all_pilot.yaml (same islands, same seed).
# InFlex is identical across 0/1/2 K (thermostat reference and fixed assets), so only HEMS runs.
# Run it after the 2 K pilot (memory). Launch with
#   uv run gridexpand run config/runs/joint_2045_internal_0k_a2_all_pilot.yaml
run:
  id: joint_2045_internal_0k_a2_all_pilot
  scenario: ../scenarios/joint_2045_internal_0k.yaml
  pipeline: paired_aligned

resources:
  pylovo_version_id: a2-all
  alignment_dir: ~/data/alignment
  # The frozen a2-all metric cohort pins the compared physical population.
  population: ~/data/joint_paired_a2_all/pylovo-a2-all-comparison.json
  # Frozen, fingerprint-checked copy of the ÜZW delivery (87c5e86c…).
  uzw_grids_dir: ~/data/uzw-grids-87c5e86c
  providers:
    swf:
      paired_dataset_id: joint_2045_internal_0k_a2_all_swf
      weather_source_hdf: weather_joint_internal0k_swf_a2_all.h5
      workers: 1
    uzw:
      paired_dataset_id: joint_2045_internal_0k_a2_all_uzw
      weather_source_hdf: weather_joint_internal0k_uzw_a2_all.h5
      workers: 2 # 3 jobs in total: about 12 GB RAM are free beside the other processes
  target_network: both # both, real, or synthetic

execution:
  optimizer: pypsa
  powerflow_grid_scope: full
  model_cases:
    - post-hems-heuristic
  workers: 2
  step3_cpus: 40
  # 1 PyPSA worker per job: 2 workers x 8 jobs filled RAM + swap when all jobs were in Step 3 (2026-09-29).
  step3_cluster_concurrency: 1
  step4_cpus: 2
  heat_workers: 8
  # null = the full 8760 h year; a number caps Step-4 power flow (smoke tests).
  powerflow_max_timesteps: null
  profile_seed: 481527
  cleanup_intermediates: false
  resume: false
  # Run both providers' runners at the same time (each with `workers`).
  parallel_providers: true
  # Expansion tables for all four groups after both providers finished.
  materialize_expansion: true
  # All 1:1 overlap components of the a2-all cohort; assignments stay the full-population ones.
  grid_subset:
    method: islands
    seed: 20261002
