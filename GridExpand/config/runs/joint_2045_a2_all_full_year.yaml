# Joint paired SWF + ÜZW full-year comparison on pylovo a2-all October aligned grids.
# One scenario YAML and one pylovo version for both providers; each provider
# gets its own paired dataset (weather, PV and TEASER heat libraries, adoption
# selection) built from its alignment bundle. Launch with
#   uv run gridexpand run config/runs/joint_2045_a2_all_full_year.yaml
run:
  id: joint_2045_a2_all_full_year
  scenario: ../scenarios/joint_2045_a2_all_full_year.yaml
  pipeline: paired_aligned

resources:
  pylovo_version_id: a2-all
  alignment_dir: ~/data/alignment
  # Frozen copy of pylovo validations_new/metrics/va2-all/comparison.json
  # SHA-256: 9b9c9ff29be2b719a6193eea300276d9603f84f3ce14d9ba94c40073c218888f
  # Its metric cohort is the compared building population.
  population: ~/data/joint_paired_a2_all/pylovo-a2-all-comparison.json
  # Frozen, fingerprint-checked copy of the ÜZW delivery (87c5e86c…).
  uzw_grids_dir: ~/data/uzw-grids-87c5e86c
  providers:
    swf:
      paired_dataset_id: joint_2045_a2_all_swf
      weather_source_hdf: weather_joint_swf_a2_all.h5
      workers: 3 # fewer, larger grids; Step 4 costs ~11 s per building (ÜZW ~5 s): 3 + 5 balances the providers
    uzw:
      paired_dataset_id: joint_2045_a2_all_uzw
      weather_source_hdf: weather_joint_uzw_a2_all.h5
      workers: 5 # 8 jobs in total; <= ~1.7 GB per job in Step 3 (1 PyPSA worker), ~0.7 GB in Step 4
  target_network: both # both, real, or synthetic

execution:
  optimizer: pypsa
  powerflow_grid_scope: full
  model_cases:
    - post-inflex-heuristic
    - post-hems-heuristic
  workers: 2
  step3_cpus: 40
  # 1 PyPSA worker per job: 2 workers x 8 jobs filled RAM + swap when all jobs were in Step 3 (2026-09-29).
  step3_cluster_concurrency: 1
  step4_cpus: 2
  heat_workers: 8
  # null = the full 8760 h year; a number caps Step-4 power flow (smoke tests).
  powerflow_max_timesteps: null
  profile_seed: 481527
  cleanup_intermediates: true
  resume: false
  # Run both providers' runners at the same time (each with `workers`).
  parallel_providers: true
  # Expansion tables for all four groups after both providers finished.
  materialize_expansion: true
