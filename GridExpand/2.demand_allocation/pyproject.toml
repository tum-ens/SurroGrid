[project]
name = "gridexpand-step2-demand-allocation"
version = "0.1.0"
description = "UV-managed environment for GridExpand Step 2 (demand allocation)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<2.3",
  "numpy>=2.2,<2.3",
  "scipy>=1.15,<1.16",
  "h5py>=3.13,<4",
  "tables>=3.10,<4",
  "pandapower>=3.1,<3.2",
  "numba>=0.61,<0.62",
  "matplotlib>=3.10,<3.11",
  "seaborn>=0.13,<0.14",
  "requests>=2.32,<3",
  "holidays>=0.73,<1",
  "pvlib>=0.12,<0.13",
  "opendhw>=0.2,<0.3",
  "richardsonpy>=0.2,<0.3",
  "teaser>=0.7,<0.8",
  "pyyaml>=6.0,<7",
  "pylightxl>=1.61,<2",
  "xlrd>=2.0,<3",
  "openpyxl>=3.1,<3.2",
  "networkx>=3.4,<4",
  "tqdm>=4.67,<5",
  "sqlalchemy>=2.0,<2.1",
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1.1,<2",
]

[tool.uv]
package = false
