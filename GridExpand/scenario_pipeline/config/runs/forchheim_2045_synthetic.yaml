# Execution and resource selection for one ordinary synthetic scenario run.
run:
  id: forchheim_2045_synthetic
  scenario: ../scenarios/forchheim_2045.yaml
  pipeline: scenario

resources:
  # Exact pylovo topology version; never inferred from the environment.
  pylovo_version_id: 1
  # AGS, bridge filename prefix, or DB-resolvable grid identifier.
  inputfile_id: "91301"
  storage: db
  # Null keeps the standard Step-2 results directory.
  output_directory: null

execution:
  # Machine-specific execution choices; scientific assumptions stay in the scenario YAML.
  n_cpu: 1
  mobility_source: pool
  demand_scope: all
  timeframe_mode: full_year
