# Execution and resource selection for the v3 (better-dimensioned) Schweinfurt run.
# v3 carries the voltage-drop-aware feeder/connection-line dimensioning (pylovo "version 2"
# feature set) and is dimensionally distinct from the v100 baseline (ampacity-only).
run:
  id: schweinfurt_2045_synthetic_v3
  scenario: ../scenarios/schweinfurt_2045.yaml
  pipeline: scenario

resources:
  # Exact pylovo topology version: v3 = voltage-drop-aware dimensioned grids.
  pylovo_version_id: 3
  # AGS, bridge filename prefix, or DB-resolvable grid identifier.
  inputfile_id: "97422"
  storage: db
  # Null keeps the standard Step-2 results directory.
  output_directory: null

execution:
  powerflow_grid_scope: full # full or backbone
  # One seed defines the physical stochastic realization shared by every model case.
  # Change it only when a deliberately different Monte Carlo realization is wanted.
  profile_seed: 481527  # Arbitrary fixed value; no geographic or scenario meaning.
  # Cases listed together use identical controlled demand/profile realizations.
  model_cases:
    - pre
    # - post-inflex-heuristic
    # - post-hems-heuristic
    - post-hems-optimized
  # Machine-specific execution choices; scientific assumptions stay in the scenario YAML.
  n_cpu: 1
  mobility_source: pool
  demand_scope: all
  timeframe_mode: full_year
