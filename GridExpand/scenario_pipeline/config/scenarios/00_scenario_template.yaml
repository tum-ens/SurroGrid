# Copy to config/scenarios/<name>.yaml and replace CHANGE_ME_scenario_id.
# UPDATE for every new scenario:
#   - scenario.id must be a unique, stable scientific-case identifier.
#   - Review all scientific values below; milestone_year and assumptions may
#     need to change for the modeled region, year, or sensitivity case.
# The values below are a valid central 2045 starting point, not universal facts.
scenario:
  id: CHANGE_ME_scenario_id
  milestone_year: 2045

economics:
  electricity:
    import_price_eur_per_kwh: 0.398
    pv_feed_in_tariff_eur_per_kwh: 0.0

asset_sizing:
  pv:
    heuristic_method: annual_electricity_rule
    optimized_method: optimization
    demand_multiplier: 2.0
    fallback_capacity_kwp: 14.5
    maximum_fallback_share: 0.0
    module_capacity_kw_per_m2: 0.202
    flat_roof_utilization: 0.27
    slanted_roof_utilization: 0.58
    tilt_bin_degrees: 5.0
    azimuth_bin_degrees: 15.0
  battery:
    heuristic_method: htw_2025_scaled_rule
    optimized_method: optimization
    minimum_pv_kwp_per_annual_mwh: 0.5
    heuristic_usable_kwh_per_pv_kwp: 1.0
    heuristic_usable_kwh_per_annual_mwh: 1.0
    optimized_upper_kwh_per_pv_kwp: 1.5
    optimized_upper_kwh_per_annual_mwh: 1.5
    energy_to_power_hours: 2.0
  heat:
    space_heat_source: infdb_ro_heat
    indoor_design_temperature_c: 20.0
    heating_limit_temperature_c: 15.0
    heat_pump_design_share: 0.65
    buffer_volume_l_per_kw_th: 20.0
    buffer_usable_temperature_spread_k: 5.0

electrification: # deterministic_share or source_inventory
  heat:
    adoption_mode: deterministic_share
    building_share: 1.0
  mobility:
    adoption_mode: deterministic_share
    building_share: 1.0
  pv_battery:
    adoption_mode: deterministic_share
    building_share: 1.0

mobility:
  commuting_probability: 0.62
  emobpy_timestep_hours: 0.5
  reference_year: 2009
  passenger_mass_kg: 75.0
  passenger_sensible_heat_w: 70.0
  passengers_per_vehicle: 1.5
  cabin_heat_transfer_coefficient: 10.0
  cabin_air_flow_m3_per_s: 0.01
  driving_cycle_type: WLTC
  road_type: 0
  road_slope: 0.0

