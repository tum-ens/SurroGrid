time_aggregation:
  # TSAM assumptions are scenario methodology, not machine/run settings.
  enabled: true
  number_of_typical_periods: 6
  hours_per_period: 168
  extreme_period_method: replace_cluster_center
  clustering_method: hierarchical
  cluster_representation: medoid
  segmentation: false
  rescale_cluster_periods: false
  # Selection features and their relative clustering weights.
  feature_weights:
    Tamb: 1.0
    Irradiation: 1.0
  # Force the coldest and highest-irradiation mean weeks into the representation.
  extreme_features:
    - minimum_mean_temperature
    - maximum_mean_irradiation
