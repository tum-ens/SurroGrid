# Scientific and methodological assumptions for the Forchheim 2045 scenario.
scenario:
  id: forchheim_2045
  milestone_year: 2045
  # Stable public cases; both heuristic post cases consume the same asset plan.
  model_cases:
    - pre
    - post-inflex-heuristic
    - post-hems-optimized
    - post-hems-heuristic

economics:
  electricity:
    # Retail electricity purchase price used by the building energy model.
    import_price_eur_per_kwh: 0.398
    # Compensation for PV exports. Zero represents no feed-in support in 2045.
    pv_feed_in_tariff_eur_per_kwh: 0.0

asset_sizing:
  pv:
    # Heuristic cases use annual base electricity demand; optimized HEMS retains bounds.
    heuristic_method: annual_electricity_rule
    optimized_method: optimization
    # "predefined" uses SWF PV locations when present; use "all_buildings" otherwise.
    location_mode: predefined
    # P_PV = min(E_annual * demand_multiplier / 1000, P_PV_max).
    demand_multiplier: 2.5
    # Used only when a selected physical building has no usable LoD2 roof section.
    fallback_capacity_kwp: 14.5
    # Publication-quality runs fail if more than this share uses the fallback.
    maximum_fallback_share: 0.0
    # Module peak capacity and usable fractions applied to actual LoD2 surface area.
    module_capacity_kw_per_m2: 0.202
    flat_roof_utilization: 0.27
    slanted_roof_utilization: 0.58
    # Shared pvlib profile grid; validated to remain below 10% annual roof deviation.
    tilt_bin_degrees: 5.0
    azimuth_bin_degrees: 15.0

  battery:
    # INFLEX and heuristic-asset HEMS use the extrapolated HTW 2025 upper bound.
    heuristic_method: htw_2025_upper_bound
    # Optimized HEMS reuses the HTW equation with LoD2 PV maximum, not fixed PV.
    optimized_method: optimization
    # Every building with positive PV potential is a battery candidate.
    location_mode: all_pv_buildings
    # Source inventories (for example SWF) restrict locations when they exist.
    predefined_locations_when_available: true
    # HTW eligibility: PV [kWp] must exceed this factor times annual demand [MWh].
    minimum_pv_kwp_per_annual_mwh: 0.5
    # Usable energy is bounded by both PV power and annual base electricity.
    maximum_usable_kwh_per_pv_kwp: 1.5
    maximum_usable_kwh_per_annual_mwh: 1.5
    # E/P = 2 h means maximum charge/discharge power equals energy / 2.
    energy_to_power_hours: 2.0

  heat:
    # Degree-day reference temperatures used to derive regional full-load hours.
    indoor_design_temperature_c: 20.0
    # DWD/VDI 20/15 convention for the existing residential building stock.
    heating_limit_temperature_c: 15.0
    # Thermal HP output at norm outdoor temperature as share of design heat load.
    heat_pump_design_share: 0.65
    # Explicit storage is space-heating-only; hourly OpenDHW demand is direct.
    buffer_volume_l_per_kw_th: 20.0
    # Usable temperature range for converting buffer litres to kWhth.
    buffer_usable_temperature_spread_k: 5.0

# Mobility behavior and emobpy vehicle-model assumptions.
mobility:
  commuting_probability: 0.62
  emobpy_timestep_hours: 0.5
  reference_year: 2009
  passenger_mass_kg: 75.0
  passenger_sensible_heat_w: 70.0
  passengers_per_vehicle: 1.5
  cabin_heat_transfer_coefficient: 10.0
  cabin_air_flow_m3_per_s: 0.01
  driving_cycle_type: WLTC
  road_type: 0
  road_slope: 0.0

