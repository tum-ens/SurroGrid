[project]
name = "gridexpand-step1-grid-sampling"
version = "0.1.0"
description = "UV-managed environment for GridExpand Step 1 (grid sampling)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<2.3",
  "numpy>=2.2,<2.3",
  "scipy>=1.15,<1.16",
  "h5py>=3.13,<4",
  "tables>=3.10,<4",
  "pandapower>=3.0,<3.2",
  "geopandas>=1.0,<1.1",
  "shapely>=2.1,<2.2",
  "pyproj>=3.7,<3.8",
  "rasterio>=1.4,<1.5",
  "contextily>=1.6,<1.7",
  "matplotlib>=3.10,<3.11",
  "openpyxl>=3.1,<3.2",
  "sqlalchemy>=2.0,<2.1",
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "lxml>=5.4,<6",
  "tqdm>=4.67,<5",
  "jupyterlab>=4.2,<5",
]

[tool.uv]
package = false
